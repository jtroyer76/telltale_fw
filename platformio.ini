; ESP-IDF 5.5.0 (platform 6.12.0). Newer platforms move to IDF 6.x — see docs/SPEC.md §8.
[env:lcd7]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv
board_build.embed_txtfiles = data/default_config.json
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Wireless update: export TELLTALE_OTA_PASS (= the device password, under Settings on the screen), then
;   pio run -e lcd7-ota -t upload                       (finds telltale.local)
;   pio run -e lcd7-ota -t upload --upload-port <ip>    (if mDNS doesn't resolve)
[env:lcd7-ota]
extends = env:lcd7
upload_protocol = custom
upload_port = telltale.local
upload_command = $PYTHONEXE tools/ota_upload.py $SOURCE $UPLOAD_PORT
