; ESP-IDF 5.5.0 (platform 6.12.0). Newer platforms move to IDF 6.x — see docs/SPEC.md §8.
[env:lcd7]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv
board_build.embed_txtfiles = data/default_config.json
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Wireless update: export TELLTALE_OTA_PASS (= the device password, under Settings on the screen), then
;   pio run -e lcd7-ota -t upload                       (finds telltale.local)
;   pio run -e lcd7-ota -t upload --upload-port <ip>    (if mDNS doesn't resolve)
[env:lcd7-ota]
extends = env:lcd7
upload_protocol = custom
upload_port = telltale.local
upload_command = $PYTHONEXE tools/ota_upload.py $SOURCE $UPLOAD_PORT

; Elecrow CrowPanel Advanced 10.1 ESP32-P4 (SPEC §3.5). The platform pinned above has no ESP32-P4
; support, so this board builds with the pioarduino fork, on ESP-IDF 5.5.6 (Elecrow's lessons use 5.5.4).
[env:crowpanel101]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
board = esp32-p4
framework = espidf
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.embed_txtfiles = data/default_config.json
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[env:crowpanel101-ota]
extends = env:crowpanel101
upload_protocol = custom
upload_port = telltale.local
upload_command = $PYTHONEXE tools/ota_upload.py $SOURCE $UPLOAD_PORT
